<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Champagne Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#E6C875"/>
    </linearGradient>

    <!-- Deep Royal Plum Gradient -->
    <linearGradient id="plumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1538"/>
      <stop offset="100%" stop-color="#26091D"/>
    </linearGradient>

    <!-- Soft Gold Radial Glow -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="1"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#26091D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ───────── LUXURY EMBLEM SEAL (Left, center Y = 40) ───────── -->
  <g transform="translate(10, 8)" filter="url(#subtleShadow)">
    <!-- Outer Delicate Gold Ring -->
    <circle cx="32" cy="32" r="30.5" stroke="url(#goldGradient)" stroke-width="1.25" stroke-dasharray="200" stroke-linecap="round"/>
    
    <!-- Inner Concentric Ring with Dotted Accents -->
    <circle cx="32" cy="32" r="27.5" stroke="#EED596" stroke-width="0.75" stroke-opacity="0.5"/>

    <!-- Subtle Premium Dark Plum Shield Background -->
    <circle cx="32" cy="32" r="26" fill="url(#plumGradient)"/>

    <!-- Interlocking Stylized Monogram H & G -->
    <!-- 'H' Left Pillar -->
    <path d="M 21.5 19.5 L 25 19.5 C 24.2 21 24.2 23 24.2 25 L 24.2 38.5 C 24.2 41 24.2 42.5 25 44.5 L 21.5 44.5 M 23.8 31.5 L 32.5 31.5" 
          stroke="url(#goldGradient)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 'H' Right Pillar seamlessly weaving into 'G' curve -->
    <path d="M 32 19.5 L 35.5 19.5 C 34.7 21 34.7 23 34.7 25 L 34.7 44.5 M 34.7 20 C 37 19.2 40 20.2 42 22.5 C 44.5 25.5 44.8 30.5 43.5 35 C 42 40.5 37.5 45 32 45 C 25.5 45 20.5 40 20.5 33 C 20.5 30 21.5 27.5 23 25" 
          stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- 'G' Crossbar -->
    <path d="M 34.5 35.5 L 42.5 35.5 L 42.5 40" 
          stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4-Point Radiance Star (Crest Sparkle) -->
    <path d="M 46 16 Q 46 20 50 20 Q 46 20 46 24 Q 46 20 42 20 Q 46 20 46 16 Z" 
          fill="url(#goldGradient)"/>
    <circle cx="46" cy="20" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- ───────── REFINED EDITORIAL WORDMARK (HerrGlow) ───────── -->
  <!-- Primary Brand Name -->
  <text x="86" y="44" 
        font-family="'Fraunces', 'Playfair Display', 'Cormorant Garamond', 'Cinzel', Didot, serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="-0.02em" 
        fill="url(#plumGradient)">
    HerrGlow
  </text>

  <!-- Signature Diamond Star Period -->
  <path d="M 235 34 Q 235 38 239 38 Q 235 38 235 42 Q 235 38 231 38 Q 235 38 235 34 Z" 
        fill="url(#goldGradient)"/>
  <circle cx="235" cy="38" r="1" fill="#FFFFFF"/>

  <!-- ───────── LUXURY DESCRIPTOR SUBTITLE ───────── -->
  <text x="88" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="8" 
        font-weight="600" 
        letter-spacing="0.32em" 
        fill="#C59B27">
    LUXURY SALON AT HOME
  </text>
</svg>
